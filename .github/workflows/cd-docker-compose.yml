name: CD — Docker Compose Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:

  deploy-compose:
    name: Deploy via Docker Compose
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get Git short SHA
        id: sha
        run: echo "short=$(echo '${{ github.event.workflow_run.head_sha }}' | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add deployment server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Pull & restart services
        env:
          IMAGE_TAG: ${{ steps.sha.outputs.short }}
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'ENDSSH'
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            IMAGE_TAG=$IMAGE_TAG docker compose pull \
              eureka config-server inventory-service loan-service api-gateway
            IMAGE_TAG=$IMAGE_TAG docker compose up -d --remove-orphans
            sleep 30
          ENDSSH

      - name: Verify gateway health
        id: health
        continue-on-error: true
        run: |
          for i in $(seq 1 12); do
            STATUS=$(ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
              "curl -sf http://localhost:8080/actuator/health | grep -o '\"status\":\"[A-Z]*\"' | head -1" 2>/dev/null || echo "ERROR")
            echo "Attempt $i: $STATUS"
            if echo "$STATUS" | grep -q '"status":"UP"'; then
              echo "health=ok" >> $GITHUB_OUTPUT
              exit 0
            fi
            sleep 10
          done
          echo "health=fail" >> $GITHUB_OUTPUT
          exit 1

      - name: Smoke test — public endpoints
        if: steps.health.outputs.health == 'ok'
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'ENDSSH'
            set -e
            curl -sf http://localhost:8080/actuator/health | python3 -m json.tool
            HTTP=$(curl -o /dev/null -sw "%{http_code}" -X POST http://localhost:8080/auth/login \
              -H "Content-Type: application/json" -d '{}')
            echo "Auth endpoint status: $HTTP"
            [[ "$HTTP" == "400" || "$HTTP" == "401" ]] && echo "OK" || (echo "Unexpected status" && exit 1)
          ENDSSH

      - name: Rollback to :latest on failure
        if: steps.health.outputs.health != 'ok'
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'ENDSSH'
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            docker compose up -d --remove-orphans
          ENDSSH

      - name: Fail pipeline if rollback triggered
        if: steps.health.outputs.health != 'ok'
        run: exit 1

      - name: Deployment summary
        if: steps.health.outputs.health == 'ok'
        run: |
          echo "### Deployment successful" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Image tag** | \`${{ steps.sha.outputs.short }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Host** | \`${{ secrets.DEPLOY_HOST }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Gateway** | http://${{ secrets.DEPLOY_HOST }}:8080 |" >> $GITHUB_STEP_SUMMARY
          echo "| **RabbitMQ UI** | http://${{ secrets.DEPLOY_HOST }}:15672 |" >> $GITHUB_STEP_SUMMARY
