# ============================================================
# Emergency Equipment Lending Platform — Docker Compose
#
# Architecture (ADR-001 through ADR-005):
#   Infrastructure:  mysql-inventory, mysql-loan, rabbitmq, zipkin
#   Platform layer:  eureka, config-server
#   Domain services: inventory-service, loan-service, api-gateway
#
# Usage:
#   cp .env.example .env && nano .env   # fill real credentials
#   docker compose up -d
#   docker compose logs -f api-gateway
#
# Image tags: override with IMAGE_TAG env var (default: latest)
#   IMAGE_TAG=abc1234 docker compose up -d
# ============================================================

x-healthcheck-defaults: &healthcheck-defaults
  interval: 15s
  timeout: 5s
  retries: 10
  start_period: 40s

services:

  # ── Infrastructure ────────────────────────────────────────

  mysql-inventory:
    image: mysql:8.4
    container_name: eelp-mysql-inventory
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: inventory_db
      MYSQL_USER: ${INVENTORY_DB_USER:-inventory_user}
      MYSQL_PASSWORD: ${INVENTORY_DB_PASS:-inventory_pass}
    ports:
      - "3307:3306"
    volumes:
      - mysql-inventory-data:/var/lib/mysql
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
    networks:
      - eelp-network

  mysql-loan:
    image: mysql:8.4
    container_name: eelp-mysql-loan
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: loan_db
      MYSQL_USER: ${LOAN_DB_USER:-loan_user}
      MYSQL_PASSWORD: ${LOAN_DB_PASS:-loan_pass}
    ports:
      - "3308:3306"
    volumes:
      - mysql-loan-data:/var/lib/mysql
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
    networks:
      - eelp-network

  rabbitmq:
    image: rabbitmq:4-management
    container_name: eelp-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"   # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
    networks:
      - eelp-network

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: eelp-zipkin
    restart: unless-stopped
    ports:
      - "9411:9411"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "wget -qO- http://localhost:9411/health || exit 1"]
    networks:
      - eelp-network

  # ── Platform Layer (must start before domain services) ───

  eureka:
    image: ${DOCKER_REGISTRY:-ghcr.io/vinayreddy072}/eureka-server:${IMAGE_TAG:-latest}
    container_name: eelp-eureka
    build:
      context: .
      dockerfile: platform/eureka-server/Dockerfile
    restart: unless-stopped
    ports:
      - "8761:8761"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep -q UP || exit 1"]
    networks:
      - eelp-network

  config-server:
    image: ${DOCKER_REGISTRY:-ghcr.io/vinayreddy072}/config-server:${IMAGE_TAG:-latest}
    container_name: eelp-config-server
    build:
      context: .
      dockerfile: platform/config-server/Dockerfile
    restart: unless-stopped
    environment:
      CONFIG_REPO_PATH: file:///config-repo
      # Eureka URL override for Docker networking (ADR-004)
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
    ports:
      - "8888:8888"
    depends_on:
      eureka:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health | grep -q UP || exit 1"]
    networks:
      - eelp-network

  # ── Domain Microservices ──────────────────────────────────

  inventory-service:
    image: ${DOCKER_REGISTRY:-ghcr.io/vinayreddy072}/inventory-service:${IMAGE_TAG:-latest}
    container_name: eelp-inventory
    build:
      context: .
      dockerfile: services/inventory-service/Dockerfile
    restart: unless-stopped
    environment:
      # Spring profile — pulls inventory-service-production.yml from Config Server (ADR-004)
      SPRING_PROFILES_ACTIVE: production
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
      # DB credentials (ADR-005 — separate schema/user per service)
      INVENTORY_DB_URL: jdbc:mysql://mysql-inventory:3306/inventory_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      INVENTORY_DB_USER: ${INVENTORY_DB_USER:-inventory_user}
      INVENTORY_DB_PASS: ${INVENTORY_DB_PASS:-inventory_pass}
      # RabbitMQ (ADR-002 — async event consumer)
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      # Eureka registration (ADR-004)
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      # Zipkin tracing endpoint
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
    ports:
      - "8082:8082"
    depends_on:
      mysql-inventory:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q UP || exit 1"]
    networks:
      - eelp-network

  loan-service:
    image: ${DOCKER_REGISTRY:-ghcr.io/vinayreddy072}/loan-service:${IMAGE_TAG:-latest}
    container_name: eelp-loan
    build:
      context: .
      dockerfile: services/loan-service/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: production
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
      # DB credentials (ADR-005)
      LOAN_DB_URL: jdbc:mysql://mysql-loan:3306/loan_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      LOAN_DB_USER: ${LOAN_DB_USER:-loan_user}
      LOAN_DB_PASS: ${LOAN_DB_PASS:-loan_pass}
      # RabbitMQ (ADR-002 — async event publisher)
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      # Eureka (ADR-004)
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      # Zipkin
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
    ports:
      - "8081:8081"
    depends_on:
      mysql-loan:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP || exit 1"]
    networks:
      - eelp-network

  api-gateway:
    image: ${DOCKER_REGISTRY:-ghcr.io/vinayreddy072}/api-gateway:${IMAGE_TAG:-latest}
    container_name: eelp-gateway
    build:
      context: .
      dockerfile: platform/api-gateway/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: production
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
      # JWT secret (ADR-001 — HMAC-SHA256, must be set; gateway refuses to start if absent)
      JWT_SECRET: ${JWT_SECRET}
      # Eureka (ADR-004 — resolves lb://loan-service and lb://inventory-service)
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      # Zipkin
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
    ports:
      - "8080:8080"
    depends_on:
      loan-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
    networks:
      - eelp-network

# ── Volumes ──────────────────────────────────────────────────
volumes:
  mysql-inventory-data:
  mysql-loan-data:
  rabbitmq-data:

# ── Network ──────────────────────────────────────────────────
networks:
  eelp-network:
    driver: bridge
