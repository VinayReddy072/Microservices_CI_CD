# ============================================================
# ConfigMap — non-sensitive shared configuration
# Contains infrastructure URLs and feature flags shared by all services.
# Sensitive values (passwords, JWT_SECRET) live in secrets.yaml.
#
# ADR-004: Spring Cloud Config Server manages per-service config.
# This ConfigMap handles infrastructure-level coordinates that
# Config Server itself needs (Eureka URL, RabbitMQ host, etc.).
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: eelp-config
  namespace: eelp-production
  labels:
    app.kubernetes.io/part-of: eelp
data:
  # Eureka registration URL (ADR-004 — all services register here)
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8761/eureka/"

  # RabbitMQ host (ADR-002 — loan.events exchange)
  RABBITMQ_HOST: "rabbitmq"

  # Zipkin tracing endpoint
  MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: "http://zipkin:9411/api/v2/spans"

  # Config Server import URL (ADR-004)
  SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"

  # Config Repo path inside the config-server container
  CONFIG_REPO_PATH: "file:///config-repo"

  # Spring profile — all domain services use the production profile
  SPRING_PROFILES_ACTIVE: "production"

  # MySQL connection suffixes
  DB_OPTIONS: "useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"

  # Inventory datasource URL (points to mysql-inventory K8s service)
  INVENTORY_DB_URL: "jdbc:mysql://mysql-inventory:3306/inventory_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"

  # Loan datasource URL (points to mysql-loan K8s service)
  LOAN_DB_URL: "jdbc:mysql://mysql-loan:3306/loan_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
