# ============================================================
# Eureka Server — Service Registry (ADR-004)
# All 5 Spring Boot processes register here on startup.
# API Gateway and Loan Service resolve lb:// URIs via this registry.
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
  namespace: eelp-production
  labels:
    app: eureka-server
    app.kubernetes.io/part-of: eelp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka-server
  template:
    metadata:
      labels:
        app: eureka-server
    spec:
      containers:
        - name: eureka-server
          image: ghcr.io/vinayreddy072/eureka-server:latest
          ports:
            - containerPort: 8761
          envFrom:
            - configMapRef:
                name: eelp-config
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8761
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8761
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
