# ============================================================
# API Gateway — Service (ADR-001)
# LoadBalancer type — the ONLY externally exposed service.
# All external client traffic enters here (ADR-001 gateway-centred security).
# Domain services (8081, 8082) are ClusterIP only.
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: eelp-production
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: eelp
spec:
  # LoadBalancer: gets a cloud public IP.
  # Change to NodePort for bare-metal/local clusters.
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
