# ============================================================
# Loan Service — Service (ADR-004)
# ClusterIP — internal only. API Gateway resolves via lb://loan-service.
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: loan-service
  namespace: eelp-production
  labels:
    app: loan-service
    app.kubernetes.io/part-of: eelp
spec:
  type: ClusterIP
  selector:
    app: loan-service
  ports:
    - name: http
      protocol: TCP
      port: 8081
      targetPort: 8081
