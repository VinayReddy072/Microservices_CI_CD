# ============================================================
# RabbitMQ Service (ADR-002)
# ClusterIP for AMQP port (5672) — domain services connect internally.
# Optional: expose Management UI (15672) via NodePort for debugging.
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: eelp-production
  labels:
    app: rabbitmq
    app.kubernetes.io/part-of: eelp
spec:
  type: ClusterIP
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      protocol: TCP
      port: 5672
      targetPort: 5672
    - name: management
      protocol: TCP
      port: 15672
      targetPort: 15672
