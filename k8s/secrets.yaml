# ============================================================
# Secrets — sensitive credentials
# ⚠️  TEMPLATE FILE — Replace all <base64-encoded-value> placeholders.
#
# Generate base64: echo -n "mypassword" | base64
#
# In production, use Sealed Secrets or External Secrets Operator
# to avoid storing real secrets in Git.
#
# ADR-001: JWT_SECRET must be present; api-gateway refuses to start without it.
# ADR-005: Separate DB credentials per service.
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: eelp-secrets
  namespace: eelp-production
  labels:
    app.kubernetes.io/part-of: eelp
type: Opaque
data:
  # JWT signing secret (ADR-001 — HMAC-SHA256)
  # echo -n "your-256-bit-secret" | base64
  JWT_SECRET: <base64-encoded-jwt-secret>

  # MySQL root password (used by MySQL StatefulSets)
  MYSQL_ROOT_PASSWORD: <base64-encoded-root-password>

  # Inventory Service DB credentials (ADR-005)
  INVENTORY_DB_USER: <base64-encoded-inventory-user>
  INVENTORY_DB_PASS: <base64-encoded-inventory-pass>

  # Loan Service DB credentials (ADR-005)
  LOAN_DB_USER: <base64-encoded-loan-user>
  LOAN_DB_PASS: <base64-encoded-loan-pass>

  # RabbitMQ credentials (ADR-002)
  RABBITMQ_USER: <base64-encoded-rabbitmq-user>
  RABBITMQ_PASSWORD: <base64-encoded-rabbitmq-pass>
