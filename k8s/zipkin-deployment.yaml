# ============================================================
# Zipkin — Distributed Tracing (OTel + Micrometer)
# All services export spans via opentelemetry-exporter-zipkin.
# Endpoint: http://zipkin:9411/api/v2/spans (ADR-004 config)
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zipkin
  namespace: eelp-production
  labels:
    app: zipkin
    app.kubernetes.io/part-of: eelp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zipkin
  template:
    metadata:
      labels:
        app: zipkin
    spec:
      containers:
        - name: zipkin
          image: openzipkin/zipkin:latest
          ports:
            - containerPort: 9411
          readinessProbe:
            httpGet:
              path: /health
              port: 9411
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 9411
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: zipkin
  namespace: eelp-production
  labels:
    app: zipkin
    app.kubernetes.io/part-of: eelp
spec:
  type: ClusterIP
  selector:
    app: zipkin
  ports:
    - name: zipkin
      protocol: TCP
      port: 9411
      targetPort: 9411
